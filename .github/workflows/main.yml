name: RDP Cloud Server (Tailscale)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1) تفعيل سطح المكتب البعيد وإنشاء المستخدم
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host "::add-mask::$env:RDP_PASSWORD"
          $pass = if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { "Abdo@2026Pass" } else { $env:RDP_PASSWORD }
          
          # تفعيل RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          
          # إنشاء مستخدم باسم AbdoDiab
          net user AbdoDiab $pass /add /y
          net localgroup administrators AbdoDiab /add
          Write-Host "تم إنشاء مستخدم RDP بنجاح!"

      - name: 2) ربط شبكة Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: 3) عرض الـ IP والاتصال
        shell: powershell
        run: |
          $ip = tailscale ip -4
          Write-Host "=========================================="
          Write-Host "عنوان IP للاتصال هو:"
          Write-Host ">>> $ip <<<"
          Write-Host "اسم المستخدم: AbdoDiab"
          Write-Host "=========================================="
          
          # إبقاء السيرفر شغال حتى 6 ساعات
          for ($i = 0; $i -lt 72; $i++) {
            Start-Sleep -Seconds 300
            Write-Host "السيرفر شغال ونشط..."
          }
