name: RDP Cloud Server

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1) Enable RDP and Create User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $pass = if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { "Abdo@2026Pass" } else { $env:RDP_PASSWORD }
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          net user AbdoDiab $pass /add /y
          net localgroup administrators AbdoDiab /add
          Write-Output "User AbdoDiab created successfully"

      - name: 2) Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: 3) Show IP and Keep Alive
        shell: powershell
        run: |
          $ip = tailscale ip -4
          Write-Output "========================================"
          Write-Output "YOUR RDP IP IS: $ip"
          Write-Output "USERNAME: AbdoDiab"
          Write-Output "========================================"
          for ($i = 0; $i -lt 72; $i++) {
            Start-Sleep -Seconds 300
            Write-Output "Server is running smoothly..."
          }
